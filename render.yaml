services:
  - type: web
    name: youtube-audio-bot
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/bgutil
      cd /opt/bgutil/server
      npm ci
      npx tsc

    startCommand: |
      node /opt/bgutil/server/build/main.js --host 127.0.0.1 --port 4416 &
      python app.py

    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false